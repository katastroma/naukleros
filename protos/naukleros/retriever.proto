syntax = "proto3";

package naukleros;

option go_package = "github.com/katastroma/naukleros";

// RetrieverService fetches source content and determines fetch relevance.
service RetrieverService {
  // Match determines if a source event matches a GitOps Identity.
  rpc Match(MatchRequest) returns (MatchResponse);

  // Fetch retrieves source content from a repository.
  rpc Fetch(FetchRequest) returns (stream FetchResponse);
}

message Source {
  string url = 1;
}

message GitEvent {
  string ref = 1;
  string before = 2;
  string after = 3;
}

message S3Event {
  string bucket_name = 1;
  string object_key = 2;
}

message OCIEvent {
  string repo = 1;
  string tag = 2;
}

message FilesystemEvent {
  string path = 1;
}

message SourceEvent {
  Source source = 1;

  oneof event {
    GitEvent git = 2;
    S3Event s3 = 3;
    OCIEvent oci = 4;
    FilesystemEvent fs = 5;
  }
}

// Event and tracking data for relevance check.
message MatchRequest {
  SourceEvent event = 1;
}

message GitOpsIdentity {
  string ref = 1;
  string path = 2;
}

message OCIIdentity {
  string repo = 1;
}

message FilesystemIdentity {
  string folder = 1;
}

message S3Identity {
  string bucket_name = 1;
  string prefix = 2;
}

message SourceIdentity {
  Source source = 1;

  oneof identity {
    GitOpsIdentity git = 2;
    S3Identity s3 = 3;
    OCIIdentity oci = 4;
    FilesystemIdentity fs = 5;
  }
}

message MatchResponse {
  SourceIdentity source_identity = 1;
}

message FetchRequest {
  SourceIdentity identity = 1;
}

// Streamed source content.
message FetchResponse {
  bytes data = 1;
}
