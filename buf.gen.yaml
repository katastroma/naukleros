version: v2

plugins:
  - remote: buf.build/protocolbuffers/go
    out: go
    opt:
      - module=github.com/katastroma/naukleros

  - remote: buf.build/grpc/go
    out: go
    opt:
      - module=github.com/katastroma/naukleros

  - local: protoc-gen-prost
    out: rust/src/pb
    opt:
      - flat_output_dir=true

  - local: protoc-gen-tonic
    out: rust/src/pb
    opt:
      - flat_output_dir=true
